services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: rag-company-assistant-backend
    env_file:
      - path: ./backend/.env
        required: false  # lets 'docker compose config' work before you create .env
    environment:
      PORT: "8000"
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
