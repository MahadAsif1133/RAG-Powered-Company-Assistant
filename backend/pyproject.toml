[project]
name = "knowledge-assistant-backend"
version = "0.1.0"
description = "RAG backend for Company Knowledge Assistant"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",

    # Supabase
    "supabase>=2.5.0",
    "gotrue>=2.5.0",

    # LLM & Embeddings
    "anthropic>=0.30.0",
    "voyageai>=0.3.0",
    "openai>=1.35.0",       # fallback embedder

    # Document parsing
    "unstructured[pdf,docx]>=0.14.0",
    "pypdf>=4.2.0",
    "python-docx>=1.1.2",

    # Rate limiting
    "slowapi>=0.1.9",

    # Config & utilities
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",

    # Slack
    "slack-bolt>=1.19.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",    # for TestClient
]
eval = [
    "ragas>=0.4.3",
    "langchain-groq>=0.3.0",
    "langchain-voyageai>=0.3.0",
    "datasets>=3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
